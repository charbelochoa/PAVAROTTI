name: Kali y Arch
on:
  push:
    branches: [main]
    paths: ['launcher/**', 'extension/**', 'scripts/**', 'assets/**', 'tests/**', 'ejemplos/**', '.github/workflows/linux.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  portable:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: false
      - name: Compilar el paquete de Linux
        run: python3 scripts/build.py --target linux
      - name: Extraer y verificar la distribución
        id: package
        working-directory: dist
        run: |
          sha256sum -c PAVAROTTI-linux-x64.tar.gz.sha256
      - name: Probar el lanzador en Kali Rolling
        run: >-
          docker run --rm -v "$PWD/dist/PAVAROTTI-Kali-x64.run:/media/PAVAROTTI.run:ro"
          -v "$PWD/tests:/tests:ro" kalilinux/kali-rolling bash /tests/distro.sh
      - name: Probar el lanzador en Arch Linux
        if: "!cancelled() && steps.package.outcome == 'success'"
        run: >-
          docker run --rm -v "$PWD/dist/PAVAROTTI-Kali-x64.run:/media/PAVAROTTI.run:ro"
          -v "$PWD/tests:/tests:ro" archlinux:base bash /tests/distro.sh
