name: PAVAROTTI
on:
  push:
    branches: [main, 'blue-team/**']
  pull_request:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.11'
          cache: false
      - run: go test ./...
      - run: go vet ./...
      - run: go build -trimpath -o PAVAROTTI.exe .
      - run: .\PAVAROTTI.exe -version
  linux:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: pavarotti_test
          POSTGRES_USER: pavarotti
          POSTGRES_PASSWORD: pavarotti-ci
        ports: ['5432/tcp']
        options: >-
          --health-cmd "pg_isready -U pavarotti -d pavarotti_test"
          --health-interval 3s --health-timeout 3s --health-retries 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.11'
          cache: false
      - run: go test -count=1 ./...
        env:
          PAVAROTTI_TEST_POSTGRES: postgres://pavarotti:pavarotti-ci@127.0.0.1:${{ job.services.postgres.ports[5432] }}/pavarotti_test?sslmode=disable
      - run: go vet ./...
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.10.0 ./...
      - run: CGO_ENABLED=0 go build -trimpath -o PAVAROTTI-Kali-x64 .
      - name: Ingesta OSINT con el binario de Kali y Arch
        run: |
          samples=$(mktemp -d)
          cat > "$samples/rdap.json" <<'JSON'
          {"objectClassName":"domain","ldhName":"evidencia.example.invalid","status":["active"]}
          JSON
          printf 'PAVAROTTI CI\n' > "$samples/muestra.bin"
          digest=$(sha256sum "$samples/muestra.bin")
          digest=${digest%% *}
          cat > "$samples/stix.json" <<JSON
          {"type":"bundle","id":"bundle--b451dd1c-4321-4bee-99b7-7dcaf8148f8f","objects":[
            {"type":"indicator","spec_version":"2.1","id":"indicator--9324a333-6a0b-4df1-8fdb-d266df2800ea","pattern_type":"stix","pattern":"[domain-name:value = 'evidencia.example.invalid']"},
            {"type":"indicator","spec_version":"2.1","id":"indicator--02c4f029-91de-4acf-8b9a-8aee0a0a9ec6","pattern_type":"stix","pattern":"[file:hashes.'SHA-256' = '$digest']"},
            {"type":"ipv4-addr","id":"ipv4-addr--cc679f46-2dbb-5c79-abdf-563768ff1ffa","value":"192.0.2.0/24"}
          ]}
          JSON
          cat > "$samples/dns.json" <<'JSON'
          {"Status":0,"Answer":[{"name":"dns.example.invalid","type":1,"data":"192.0.2.17"}]}
          JSON
          for image in kalilinux/kali-rolling archlinux:base; do
            docker run --rm --network none -v "$PWD/PAVAROTTI-Kali-x64:/opt/pavarotti:ro" -v "$samples:/samples:ro" "$image" /bin/sh -ec '
              /opt/pavarotti -version >&2
              /opt/pavarotti -datos /tmp/expediente importar rdap /samples/rdap.json >&2
              /opt/pavarotti -datos /tmp/expediente importar stix /samples/stix.json >&2
              /opt/pavarotti -datos /tmp/expediente importar dns /samples/dns.json >&2
              /opt/pavarotti -datos /tmp/expediente importar binario /samples/muestra.bin >&2
              /opt/pavarotti -datos /tmp/expediente activos --tipo dominio --valor evidencia.example.invalid --json
              /opt/pavarotti -datos /tmp/expediente analizar --json
              /opt/pavarotti -datos /tmp/expediente exportar --formato stix --salida /tmp/intercambio.json
              /opt/pavarotti -datos /tmp/destino importar stix /tmp/intercambio.json >&2
              /opt/pavarotti -datos /tmp/destino listar --tipo stix --limite 0 --json
            ' > "$samples/resultados.json"
            python3 - "$samples/resultados.json" "$digest" <<'PY'
          import json
          import sys
          from pathlib import Path
          payload = Path(sys.argv[1]).read_text(encoding="utf-8")
          decoder = json.JSONDecoder()
          asset, offset = decoder.raw_decode(payload)
          remaining = payload[offset:].lstrip()
          report, offset = decoder.raw_decode(remaining)
          exchange = json.loads(remaining[offset:])
          assert asset["value"] == "evidencia.example.invalid"
          assert asset["count"] == 2 and asset["indicators"] == 1
          assert {row["role"] for row in asset["rows"]} == {"registro", "indicador"}
          assert all(row["id"] and row["revision"] == 1 for row in asset["rows"])
          assert report["records"] == 6 and report["agent_version"] == "2"
          match, = report["matches"]
          assert match["value"] == asset["value"]
          assert {item["kind"] for item in match["evidence"]} == {"rdap", "stix"}
          sample, = report["hash_matches"]
          assert sample["value"] == sys.argv[2]
          assert {item["kind"] for item in sample["evidence"]} == {"binario", "stix"}
          network, = report["network_matches"]
          assert network["value"] == "192.0.2.0/24" and network["samples"] == ["192.0.2.17"]
          assert any(row.get("file_hashes", []) == [{"type": "sha256", "value": sys.argv[2]}] for row in exchange)
          assert any(row.get("stix", {}).get("observation", {}).get("count") == 1 for row in exchange)
          assert any(row.get("network") == "192.0.2.0/24" for row in exchange)
          assert any(origin["external_id"].endswith("@1") for row in exchange for origin in row.get("stix", {}).get("origins", []))
          PY
          done
  compose:
    runs-on: ubuntu-24.04
    env:
      PAVAROTTI_DB_PASSWORD: pavarotti-compose-ci
      PAVAROTTI_WEB_PORT: 8376
    steps:
      - uses: actions/checkout@v4
      - run: docker compose up --build --wait --wait-timeout 120
      - run: curl --fail --silent http://127.0.0.1:8376/api/app
      - run: docker compose exec -T app pavarotti nota --titulo "Prueba local" --texto "Evidencia en PostgreSQL"
      - run: docker compose exec -T app pavarotti encolar --prioridad 2 > tarea-ci.json
      - run: docker compose restart app
      - run: curl --fail --silent --retry 10 --retry-connrefused http://127.0.0.1:8376/api/app
      - run: |
          docker compose exec -T app pavarotti listar --json > expediente-ci.json
          python3 -c 'import json; assert any(r["details"] == "Evidencia en PostgreSQL" for r in json.load(open("expediente-ci.json")))'
      - run: |
          python3 - <<'PY'
          import json
          import time
          import urllib.request
          task = json.load(open("tarea-ci.json"))
          for _ in range(25):
              with urllib.request.urlopen("http://127.0.0.1:8376/api/analisis/tareas/" + task["id"], timeout=3) as response:
                  job = json.load(response)["job"]
              if job["state"] == "succeeded":
                  assert job["result"]["input_sha256"] == task["sha256"]
                  assert job["result"]["records"] == 1
                  break
              assert job["state"] in ("queued", "running"), job
              time.sleep(1)
          else:
              raise SystemExit("No se recuperó el informe al reiniciar Compose")
          PY
      - if: failure()
        run: docker compose logs --tail 80
