name: PAVAROTTI
on:
  push:
    branches: [main, 'blue-team/**']
  pull_request:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.11'
          cache: false
      - run: go test ./...
      - run: go vet ./...
      - run: go build -trimpath -o PAVAROTTI.exe .
      - run: .\PAVAROTTI.exe -version
  linux:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: pavarotti_test
          POSTGRES_USER: pavarotti
          POSTGRES_PASSWORD: pavarotti-ci
        ports: ['5432/tcp']
        options: >-
          --health-cmd "pg_isready -U pavarotti -d pavarotti_test"
          --health-interval 3s --health-timeout 3s --health-retries 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.11'
          cache: false
      - name: Preparar base de destino para restauración
        env:
          POSTGRES_SERVICE: ${{ job.services.postgres.id }}
        run: docker exec -e PGPASSWORD=pavarotti-ci "$POSTGRES_SERVICE" createdb -h 127.0.0.1 -U pavarotti pavarotti_restore
      - run: go test -count=1 ./...
        env:
          PAVAROTTI_TEST_POSTGRES: postgres://pavarotti:pavarotti-ci@127.0.0.1:${{ job.services.postgres.ports[5432] }}/pavarotti_test?sslmode=disable
          PAVAROTTI_TEST_POSTGRES_RESTORE: postgres://pavarotti:pavarotti-ci@127.0.0.1:${{ job.services.postgres.ports[5432] }}/pavarotti_restore?sslmode=disable
      - run: go vet ./...
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.10.0 ./...
      - run: CGO_ENABLED=0 go build -trimpath -o PAVAROTTI-Kali-x64 .
      - name: Ingesta OSINT con el binario de Kali y Arch
        run: |
          samples=$(mktemp -d)
          cat > "$samples/rdap.json" <<'JSON'
          {"objectClassName":"domain","ldhName":"evidencia.example.invalid","status":["active"]}
          JSON
          printf 'PAVAROTTI CI\n' > "$samples/muestra.bin"
          digest=$(sha256sum "$samples/muestra.bin")
          digest=${digest%% *}
          cat > "$samples/stix.json" <<JSON
          {"type":"bundle","id":"bundle--b451dd1c-4321-4bee-99b7-7dcaf8148f8f","objects":[
            {"type":"indicator","spec_version":"2.1","id":"indicator--9324a333-6a0b-4df1-8fdb-d266df2800ea","pattern_type":"stix","pattern":"[domain-name:value = 'evidencia.example.invalid']"},
            {"type":"indicator","spec_version":"2.1","id":"indicator--02c4f029-91de-4acf-8b9a-8aee0a0a9ec6","pattern_type":"stix","pattern":"[file:hashes.'SHA-256' = '$digest']"},
            {"type":"ipv4-addr","id":"ipv4-addr--cc679f46-2dbb-5c79-abdf-563768ff1ffa","value":"192.0.2.0/24"}
          ]}
          JSON
          cat > "$samples/dns.json" <<'JSON'
          {"Status":0,"Answer":[{"name":"dns.example.invalid","type":1,"data":"192.0.2.17"}]}
          JSON
          mkdir -p "$samples/revision/src"
          cat > "$samples/revision/go.mod" <<'MOD'
          module sample.invalid/service
          require sample.invalid/catalog v1.2.3
          MOD
          cat > "$samples/revision/src/fixture.go" <<'GO'
          package fixture
          import "net/http"
          var _ = http.Client{}
          GO
          for image in kalilinux/kali-rolling archlinux:base; do
            docker run --rm --network none -v "$PWD/PAVAROTTI-Kali-x64:/opt/pavarotti:ro" -v "$samples:/samples:ro" "$image" /bin/sh -ec '
              /opt/pavarotti -version >&2
              /opt/pavarotti -datos /tmp/expediente importar rdap /samples/rdap.json >&2
              /opt/pavarotti -datos /tmp/expediente importar stix /samples/stix.json >&2
              /opt/pavarotti -datos /tmp/expediente importar dns /samples/dns.json >&2
              /opt/pavarotti -datos /tmp/expediente importar binario /samples/muestra.bin >&2
              /opt/pavarotti -datos /tmp/expediente revisar --json /samples/revision
              /opt/pavarotti -datos /tmp/expediente activos --tipo dominio --valor evidencia.example.invalid --json
              /opt/pavarotti -datos /tmp/expediente analizar --json
              /opt/pavarotti -datos /tmp/expediente exportar --formato stix --salida /tmp/intercambio.json
              /opt/pavarotti -datos /tmp/destino importar stix /tmp/intercambio.json >&2
              /opt/pavarotti -datos /tmp/destino listar --tipo stix --limite 0 --json
            ' > "$samples/resultados.json"
            python3 - "$samples/resultados.json" "$digest" <<'PY'
          import json
          import sys
          from pathlib import Path
          payload = Path(sys.argv[1]).read_text(encoding="utf-8")
          decoder = json.JSONDecoder()
          review, offset = decoder.raw_decode(payload)
          remaining = payload[offset:].lstrip()
          asset, offset = decoder.raw_decode(remaining)
          remaining = remaining[offset:].lstrip()
          report, offset = decoder.raw_decode(remaining)
          exchange = json.loads(remaining[offset:])
          assert review["imported"] == 2 and review["rejected"] == 0
          assert {item["path"] for item in review["files"]} == {"go.mod", "src/fixture.go"}
          assert asset["value"] == "evidencia.example.invalid"
          assert asset["count"] == 2 and asset["indicators"] == 1
          assert {row["role"] for row in asset["rows"]} == {"registro", "indicador"}
          assert all(row["id"] and row["revision"] == 1 for row in asset["rows"])
          assert report["records"] == 8 and report["agent_version"] == "4"
          match, = report["matches"]
          assert match["value"] == asset["value"]
          assert {item["kind"] for item in match["evidence"]} == {"rdap", "stix"}
          sample, = report["hash_matches"]
          assert sample["value"] == sys.argv[2]
          assert {item["kind"] for item in sample["evidence"]} == {"binario", "stix"}
          network, = report["network_matches"]
          assert network["value"] == "192.0.2.0/24" and network["samples"] == ["192.0.2.17"]
          assert any(row.get("file_hashes", []) == [{"type": "sha256", "value": sys.argv[2]}] for row in exchange)
          assert any(row.get("stix", {}).get("observation", {}).get("count") == 1 for row in exchange)
          assert any(row.get("network") == "192.0.2.0/24" for row in exchange)
          assert any(origin["external_id"].endswith("@1") for row in exchange for origin in row.get("stix", {}).get("origins", []))
          code, = report["code_findings"]
          assert code["value"] == "http-cliente-timeout" and code["evidence"][0]["line"] == 3
          assert code["evidence"][0]["source_id"] == "src/fixture.go"
          dependency, = report["dependencies"]
          assert dependency["value"] == "sample.invalid/catalog" and dependency["evidence"][0]["line"] == 2
          PY
          done
      - name: Instrucciones de un ELF en Kali y Arch
        run: |
          samples=$(mktemp -d)
          cat > "$samples/muestra.s" <<'ASM'
          .text
          .globl _start
          _start:
            jmp .Lfin
            nop
          .Lfin:
            ret
          ASM
          as --64 -o "$samples/muestra.o" "$samples/muestra.s"
          ld -Ttext 0x401000 -o "$samples/muestra" "$samples/muestra.o"
          for image in kalilinux/kali-rolling archlinux:base; do
            docker run --rm --network none -v "$PWD/PAVAROTTI-Kali-x64:/opt/pavarotti:ro" -v "$samples:/samples:ro" "$image" /bin/sh -ec '
              /opt/pavarotti -datos /tmp/expediente importar binario /samples/muestra >&2
              /opt/pavarotti -datos /tmp/expediente listar --tipo binario --json
            ' > "$samples/instrucciones.json"
            python3 - "$samples/instrucciones.json" "$samples/muestra" <<'PY'
          import hashlib
          import json
          import sys
          from pathlib import Path
          record, = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          sample = Path(sys.argv[2]).read_bytes()
          assert record["sha256"] == hashlib.sha256(sample).hexdigest()
          first, middle, last = json.loads(record["details"])["instructions"]
          assert first["address"] == "0x401000" and first["target"] == last["address"] == "0x401003"
          assert middle["text"] == "nop" and last["text"] == "ret"
          offset = int(first["offset"], 16)
          assert first["bytes"] == sample[offset:offset+2].hex() == "eb01"
          PY
          done
      - name: Comparación de capturas en Kali y Arch
        run: |
          samples=$(mktemp -d)
          cat > "$samples/captura.har" <<'JSON'
          {"log":{"entries":[
            {"startedDateTime":"2026-11-01T00:00:00Z","request":{"method":"GET","url":"https://example.invalid/"},
             "response":{"status":200,"headers":[{"name":"Content-Type","value":"text/html"}]}},
            {"startedDateTime":"2026-11-02T00:00:00Z","request":{"method":"GET","url":"https://example.invalid:443/"},
             "response":{"status":502,"headers":[{"name":"Strict-Transport-Security","value":"max-age=3600"}]}}
          ]}}
          JSON
          for image in kalilinux/kali-rolling archlinux:base; do
            docker run --rm --network none -v "$PWD/PAVAROTTI-Kali-x64:/opt/pavarotti:ro" -v "$samples:/samples:ro" "$image" /bin/sh -ec '
              /opt/pavarotti -datos /tmp/expediente importar har /samples/captura.har >&2
              /opt/pavarotti -datos /tmp/expediente comparar-http --origen-a https://example.invalid \
                --desde-a 2026-11-01 --hasta-a 2026-11-01 --captura-b har --desde-b 2026-11-02 --hasta-b 2026-11-02
            ' > "$samples/comparacion.json"
            python3 - "$samples/comparacion.json" <<'PY'
          import json
          import sys
          with open(sys.argv[1], encoding="utf-8") as source:
              report = json.load(source)
          assert report["schema"] == "pavarotti.http-comparison.v1"
          assert report["baseline"] == report["current"] == dict(observations=1, responses=1, transport_failures=0, assessed=1)
          rows = {row["code"]: row for row in report["rows"]}
          assert rows["2xx"]["baseline"]["count"] == rows["5xx"]["current"]["count"] == 1
          assert rows["nosniff-ausente"]["baseline"]["evidence"][0]["http_rule"] == "nosniff-ausente"
          assert rows["nosniff-ausente"]["current"]["count"] == 0
          PY
          done
  compose:
    runs-on: ubuntu-24.04
    env:
      PAVAROTTI_DB_PASSWORD: pavarotti-compose-ci
      PAVAROTTI_WEB_PORT: 8376
    steps:
      - uses: actions/checkout@v4
      - run: docker compose up --build --wait --wait-timeout 120
      - run: curl --fail --silent http://127.0.0.1:8376/api/app
      - run: docker compose exec -T app pavarotti nota --titulo "Prueba local" --texto "Evidencia en PostgreSQL"
      - run: docker compose exec -T app pavarotti encolar --prioridad 2 > tarea-ci.json
      - run: docker compose restart app
      - run: curl --fail --silent --retry 10 --retry-connrefused http://127.0.0.1:8376/api/app
      - run: |
          docker compose exec -T app pavarotti listar --json > expediente-ci.json
          python3 -c 'import json; assert any(r["details"] == "Evidencia en PostgreSQL" for r in json.load(open("expediente-ci.json")))'
      - run: |
          python3 - <<'PY'
          import json
          import time
          import urllib.request
          task = json.load(open("tarea-ci.json"))
          for _ in range(25):
              with urllib.request.urlopen("http://127.0.0.1:8376/api/analisis/tareas/" + task["id"], timeout=3) as response:
                  job = json.load(response)["job"]
              if job["state"] == "succeeded":
                  assert job["result"]["input_sha256"] == task["sha256"]
                  assert job["result"]["records"] == 1
                  break
              assert job["state"] in ("queued", "running"), job
              time.sleep(1)
          else:
              raise SystemExit("No se recuperó el informe al reiniciar Compose")
          PY
      - if: failure()
        run: docker compose logs --tail 80
  compose-https:
    runs-on: ubuntu-24.04
    env:
      PAVAROTTI_EXPEDIENTE: pruebas-https
      PAVAROTTI_HTTPS_ORIGIN: https://127.0.0.1:8377
      PAVAROTTI_HTTPS_PORT: 8377
      PAVAROTTI_TEST_ACCOUNT_PASSWORD: cuenta-sintetica-de-compose
    steps:
      - uses: actions/checkout@v4
      - name: Preparar secretos de prueba
        run: |
          directory=$(mktemp -d "$RUNNER_TEMP/pavarotti-https.XXXXXX")
          openssl rand -hex 32 | tr -d '\n' > "$directory/password"
          openssl req -x509 -newkey rsa:2048 -noenc -days 1 \
            -subj '/CN=127.0.0.1' -addext 'subjectAltName=IP:127.0.0.1' \
            -out "$directory/cert.pem" -keyout "$directory/key.pem"
          sudo chgrp 65532 "$directory/password" "$directory/cert.pem" "$directory/key.pem"
          chmod 0640 "$directory/password" "$directory/cert.pem" "$directory/key.pem"
          {
            printf 'PAVAROTTI_DB_PASSWORD_FILE=%s/password\n' "$directory"
            printf 'PAVAROTTI_TLS_CERT_FILE=%s/cert.pem\n' "$directory"
            printf 'PAVAROTTI_TLS_KEY_FILE=%s/key.pem\n' "$directory"
          } >> "$GITHUB_ENV"
      - run: docker compose -f compose.https.yaml up --build --wait --wait-timeout 120
      - run: python3 .github/scripts/check_compose_https.py
      - if: failure()
        run: docker compose -f compose.https.yaml logs --tail 80
