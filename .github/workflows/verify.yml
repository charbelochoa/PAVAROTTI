name: PAVAROTTI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache: false
      - run: go test ./...
      - run: go vet ./...
      - run: go build -trimpath -o PAVAROTTI.exe .
      - run: .\PAVAROTTI.exe -version
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache: false
      - run: go test ./...
      - run: go vet ./...
      - run: CGO_ENABLED=0 go build -trimpath -o PAVAROTTI-Kali-x64 .
      - run: docker run --rm -v "$PWD/PAVAROTTI-Kali-x64:/opt/pavarotti:ro" kalilinux/kali-rolling /opt/pavarotti -version
      - run: docker run --rm -v "$PWD/PAVAROTTI-Kali-x64:/opt/pavarotti:ro" archlinux:base /opt/pavarotti -version
